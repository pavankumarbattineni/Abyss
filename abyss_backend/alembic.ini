# Alembic: database schema migrations for Abyss.
# The database URL comes from ABYSS_CONFIG (see migrations/env.py), not here.
#
#   uv run alembic upgrade head                      # apply (startup does this too)
#   uv run alembic revision --autogenerate -m "..."  # after changing database/models.py
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
