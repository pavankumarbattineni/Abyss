[project]
name = "abyss-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29.0",
    "bcrypt>=5.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.116.0",
    "firebase-admin>=6.5.0",
    "gunicorn>=22.0.0",
    "httpx>=0.27.0",
    "langchain>=1.3.3",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=1.4.7",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=1.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "mcp>=1.9.2,<2.0.0",
    "psycopg-pool>=3.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic[email]>=2.7.0,<3.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.9.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.35.0",
    "alembic>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
# Modules import from the backend root (`from utils import ...`).
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Real mistakes only (undefined names, unused imports/variables, syntax
# errors); style rules would mean churning code that works.
select = ["E9", "F"]
