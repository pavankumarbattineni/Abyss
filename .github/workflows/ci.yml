# Continuous Integration: lint, test, build and scan on every push and PR.
#
# Three independent jobs run in parallel on fresh Ubuntu machines:
#   backend  -> ruff, migrations + catalog seed on a real Postgres, pytest
#   frontend -> eslint, TypeScript type check, production build
#   docker   -> build both images (as Render/Compose will) + Trivy CVE scan
#
# Actions are pinned to full commit SHAs (a tag can be moved by whoever
# controls the action's repo); Dependabot keeps the pins up to date.
name: CI

on:
  push:
    branches: [development, main, "Abyss-*"]
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# A newer push to the same branch/PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only get what they ask for below.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: abyss_backend

    # A throwaway Postgres just for this job, reachable on localhost:5432.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: abyss
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: abyss
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U abyss -d abyss"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      # Fake values only: the tests make no calls to OpenAI, Firebase or
      # LangSmith, so CI needs no real secrets. Only the database is real.
      ABYSS_CONFIG: >-
        {"ENVIRONMENT": "DEV",
         "DB": {"username": "abyss", "password": "ci", "database": "abyss",
                "ip_address": "localhost", "port": "5432",
                "pool_size": 5, "max_overflow": 5},
         "LLM": {"openai_api_key": "ci-fake", "openai_model": "gpt-5-mini"},
         "JWT": {"secret_key": "ci-jwt-secret-not-a-real-secret-0123456789", "algorithm": "HS256"},
         "LANGSMITH": {"tracing_enabled": false, "api_key": "", "project": "abyss-ci"},
         "MCP": {"encryption_key": "ci-encryption-key-not-a-real-secret"}}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs uv and caches its downloads between runs (keyed on uv.lock).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: abyss_backend/uv.lock

      # Exact versions from uv.lock, including dev tools (ruff, pytest).
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      # Exactly what the deploy workflow runs against Neon: Alembic upgrade
      # from an empty database, then the catalog seed.
      - name: Migrate + seed (empty database)
        run: uv run python scripts/migrate.py

      # A second run must change nothing (idempotent migrations and seed).
      - name: Migrate + seed again (no-op)
        run: uv run python scripts/migrate.py | tee migrate-again.txt && grep -q "0 catalog model(s) added" migrate-again.txt

      # The models must match the migrations (no forgotten `alembic revision`).
      - name: Schema matches models (alembic check)
        run: uv run alembic check

      - name: Tests (pytest)
        run: uv run pytest -q --junitxml=pytest-results.xml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: abyss_backend/pytest-results.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: abyss_frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholders: the build only needs these to exist (src/lib/firebase.ts
      # fails the build without them). Real values are set in Vercel.
      NEXT_PUBLIC_API_URL: http://localhost:8100
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 24 (same as the Dockerfile) with npm's download cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: abyss_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Route types live in .next/types, which a fresh checkout doesn't have:
      # generate them first, without a full build.
      - name: Type check (tsc)
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Build (next build)
        run: npm run build

  # ---------------------------------------------------------------------------
  docker:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload Trivy results to the Security tab
    strategy:
      fail-fast: false # one image failing shouldn't cancel the other's scan
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build exactly what Render/Compose build; load: true keeps the image
      # here for the scan (nothing is pushed). Layers are cached between runs.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: abyss_${{ matrix.service }}
          tags: abyss-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Frontend only (the backend Dockerfile declares no ARGs).
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8100
            NEXT_PUBLIC_FIREBASE_API_KEY=ci-placeholder
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-placeholder
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ci-placeholder.appspot.com
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=000000000000
            NEXT_PUBLIC_FIREBASE_APP_ID=1:000000000000:web:ci

      # 1) Full report (all severities) -> GitHub Security tab. Never fails.
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: abyss-${{ matrix.service }}:ci
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          exit-code: "0"

      - name: Upload scan to Security tab
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # 2) The gate: fail on CRITICAL/HIGH vulnerabilities that already have a
      # fixed version (i.e. ones we can act on).
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true" # reuse the DB the step above downloaded
        with:
          image-ref: abyss-${{ matrix.service }}:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
